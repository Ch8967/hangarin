{% extends "base.html" %}
{% block title %}New task · Hangarin{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto">
  <h2 style="margin-top:0">New task</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="field">
      {{ field.label_tag }}
      {{ field }}
      {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="btn-primary">Save task</button>
    <a class="btn" href="{% url 'home' %}">Cancel</a>
  </form>
</div>
{% endblock %}
